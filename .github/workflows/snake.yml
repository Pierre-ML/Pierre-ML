name: Serpent des contributions

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Palette obsidian / crème / carmin, reprise du portfolio : le serpent au carmin
      # (#9E1012), les contributions du fond de carte à la crème la plus dense.
      - name: Génère le SVG
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=%239E1012&color_dots=%2326211C,%238C8271,%23C5BDAD,%23E4DCCD,%23F7F2E8

      - name: Publie sur la branche output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
